# share.rlew.io Worker. The account comes from the wrangler login at deploy time.
name = "html-share"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Served on a Workers custom domain: Cloudflare creates the DNS record and the
# certificate. The workers.dev URL stays on for testing.
routes = [{ pattern = "share.rlew.io", custom_domain = true }]
workers_dev = true

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "html-share"

# No [vars] block: `wrangler deploy` would replace the deployed vars with it.
# Config is held as secrets, which survive deploys. The Worker expects:
#   COOKIE_SECRET       HMAC key for secured-page cookies
#   TOKEN_<MACHINE>     upload bearer token, one per machine
#   IP_GATES            JSON: gate name -> CIDR list (optional)
#   REDIRECTS           JSON: slug -> target path (optional)
#   ANALYTICS_SNIPPET   HTML added to <head> (optional)
# See "Deploying" in the README. The `secrets.required` key is not used: it
# cannot name the TOKEN_<MACHINE> secrets, and the last three are optional.
