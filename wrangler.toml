# share.rlew.io Worker. The account comes from the wrangler login at deploy time.
name = "html-share"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Keep variables set outside this file (dashboard or `--var`) across deploys.
keep_vars = true

# Served on a Workers custom domain: Cloudflare creates the DNS record and the
# certificate. The workers.dev URL stays on for testing.
routes = [{ pattern = "share.rlew.io", custom_domain = true }]
workers_dev = true

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "html-share"

# Password attempts on secured pages: 10 a minute per client IP, counted by
# one Durable Object per IP (src/lib/login-limiter.ts).
[[durable_objects.bindings]]
name = "LOGIN_LIMIT"
class_name = "LoginLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LoginLimiter"]

# No [vars] block, so no values here: the repo is public. REDIRECTS and
# REWRITES are plaintext vars held on Cloudflare; the rest are secrets, which
# survive deploys.
# The Worker expects:
#   COOKIE_SECRET       secret: HMAC key for secured-page cookies
#   TOKEN_<MACHINE>     secret: upload bearer token, one per machine
#   IP_GATES            secret: JSON, gate name -> CIDR list (optional)
#   REDIRECTS           var: JSON, slug -> target path (optional)
#   REWRITES            var: JSON, exact path -> folder path served in place (optional)
#   ANALYTICS_SNIPPET   secret: HTML added to <head> (optional)
# See "Deploying" in the README. The `secrets.required` key is not used: it
# cannot name the TOKEN_<MACHINE> secrets, and the last three are optional.
